name: pintam2
description: PintaM² - app profesional para pintores.
publish_to: "none"
version: 0.9.3+13

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  flutter_contacts: ^2.1.0
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
